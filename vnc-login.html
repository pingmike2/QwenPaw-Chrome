<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QwenPaw 访问认证</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap');

        :root {
            --primary: #103cbe;
            --bg: #ececec;
            --text: #1a1a2e;
            --card-bg: #ffffff;
            --input-bg: #f8f9fa;
            --border: #dee2e6;
            --error-bg: #f8d7da;
            --error-text: #842029;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Poppins', -apple-system, sans-serif;
            background: var(--bg);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }

        .box-area {
            width: 400px;
            max-width: 100%;
            background: var(--card-bg);
            border-radius: 24px;
            box-shadow: 0 12px 40px rgba(0,0,0,.12);
            overflow: hidden;
        }

        /* 顶部品牌区（单栏：上下结构） */
        .header-box {
            background: linear-gradient(135deg, var(--primary), #2d4fc7);
            color: white;
            padding: 36px 24px 32px;
            text-align: center;
        }

        .header-box .logo {
            font-size: 52px;
            margin-bottom: 12px;
            display: inline-block;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        .header-box h1 {
            font-size: 24px;
            font-weight: 600;
            font-family: 'Courier New', monospace;
            letter-spacing: 1px;
            margin-bottom: 6px;
        }

        .header-box p {
            font-size: 13px;
            opacity: .85;
            line-height: 1.6;
        }

        /* 表单区（单栏） */
        .form-box {
            padding: 28px 28px 32px;
        }

        .form-box h2 {
            font-size: 20px;
            font-weight: 600;
            color: var(--text);
            margin-bottom: 4px;
        }

        .form-box .subtitle {
            color: #6c757d;
            font-size: 13px;
            margin-bottom: 22px;
        }

        .alert {
            display: none;
            background: var(--error-bg);
            color: var(--error-text);
            padding: 12px 16px;
            border-radius: 10px;
            font-size: 13px;
            margin-bottom: 18px;
        }
        .alert.show { display: block; }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: var(--text);
            margin-bottom: 8px;
        }

        .form-group input {
            width: 100%;
            padding: 14px 16px;
            font-size: 15px;
            font-family: inherit;
            background: var(--input-bg);
            border: 2px solid var(--border);
            border-radius: 12px;
            outline: none;
            transition: all .25s;
        }

        .form-group input:focus {
            border-color: var(--primary);
            background: white;
            box-shadow: 0 0 0 3px rgba(16,60,190,.12);
        }

        .form-group input::placeholder {
            color: #adb5bd;
            font-size: 14px;
        }

        .btn-login {
            width: 100%;
            padding: 14px;
            font-size: 15px;
            font-weight: 600;
            font-family: inherit;
            color: white;
            background: var(--primary);
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: all .25s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-login:hover { background: #0d2f8f; transform: translateY(-1px); }
        .btn-login:active { transform: translateY(0); }
        .btn-login:disabled { opacity: .6; cursor: not-allowed; transform: none; }

        .spinner {
            display: none;
            width: 18px;
            height: 18px;
            border: 2px solid rgba(255,255,255,.4);
            border-top-color: white;
            border-radius: 50%;
            animation: spin .7s linear infinite;
        }
        .spinner.show { display: inline-block; }
        @keyframes spin { to { transform: rotate(360deg); } }

        .footer-note {
            margin-top: 20px;
            text-align: center;
            font-size: 12px;
            color: #adb5bd;
        }
    </style>
</head>
<body>
    <div class="box-area">
        <div class="header-box">
            <div class="logo">🤖</div>
            <h1>QwenPaw</h1>
            <p>云端 Chromium 浏览器 · 安全访问门户</p>
        </div>
        <div class="form-box">
            <h2>欢迎回来 👋</h2>
            <p class="subtitle">输入凭据以访问您的云端桌面</p>
            <div id="loginStatus" class="alert">
                <span id="loginStatusText">用户名或密码错误，请重试</span>
            </div>
            <!-- 诊断信息区域（显示 fetch 详细错误） -->
            <div id="debugInfo" style="display:none; background:#f0f0f0; border-radius:8px; padding:12px; margin-bottom:16px; font-size:12px; color:#333; word-break:break-all; max-height:200px; overflow-y:auto; border-left:4px solid #ff6b6b;">
                <div id="debugContent"></div>
            </div>
            <form id="loginForm" autocomplete="on">
                <div class="form-group">
                    <label for="usernameInput">用户名</label>
                    <input type="text" id="usernameInput" name="username"
                           placeholder="请输入用户名" maxlength="128"
                           autocomplete="username" required>
                </div>
                <div class="form-group">
                    <label for="passwordInput">密码</label>
                    <input type="password" id="passwordInput" name="password"
                           placeholder="请输入密码" maxlength="128"
                           autocomplete="current-password" required>
                </div>
                <button type="submit" id="loginButton" class="btn-login">
                    <span id="loginButtonLabel">登 录</span>
                    <span id="loginButtonSpinner" class="spinner"></span>
                </button>
            </form>
            <p class="footer-note">登录后即可远程操作您的 Chromium 桌面</p>
        </div>
    </div>

    <script>
        const form = document.getElementById('loginForm');
        const statusEl = document.getElementById('loginStatus');
        const statusText = document.getElementById('loginStatusText');
        const btn = document.getElementById('loginButton');
        const btnLabel = document.getElementById('loginButtonLabel');
        const btnSpinner = document.getElementById('loginButtonSpinner');
        const debugEl = document.getElementById('debugInfo');
        const debugContent = document.getElementById('debugContent');

        function showDebug(msg, isError = true) {
            debugEl.style.display = 'block';
            debugContent.innerHTML = msg;
            debugEl.style.borderLeftColor = isError ? '#ff6b6b' : '#51cf66';
        }

        function showError(msg) {
            statusText.innerText = msg;
            statusEl.classList.add('show');
        }

        function hideError() {
            statusEl.classList.remove('show');
            debugEl.style.display = 'none';
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            e.stopPropagation();

            const username = document.getElementById('usernameInput').value.trim();
            const password = document.getElementById('passwordInput').value;

            if (!username || !password) {
                showError('请输入用户名和密码');
                return;
            }

            hideError();
            btn.disabled = true;
            btnLabel.style.display = 'none';
            btnSpinner.classList.add('show');
            showDebug('⏳ 正在验证... 请求中', false);

            try {
                const cred = btoa(unescape(encodeURIComponent(username + ':' + password)));
                showDebug(`📤 发送请求到 /__auth_check<br>用户名: ${username}<br>请求头: Authorization Basic ****`);

                const startTime = Date.now();
                const resp = await fetch('/__auth_check', {
                    method: 'GET',
                    headers: { 'Authorization': 'Basic ' + cred }
                });
                const elapsed = Date.now() - startTime;

                showDebug(`✅ 收到响应 (${elapsed}ms)<br>状态码: ${resp.status} ${resp.statusText}<br>URL: ${resp.url}`);

                if (resp.ok) {
                    showDebug('🎉 认证成功，跳转中...', false);
                    setTimeout(() => {
                        window.location.href = './vnc.html?token=__AUTH_TOKEN__&autoconnect=1&resize=scale&show_dot=0&path=websockify%3Ftoken%3D__AUTH_TOKEN__';
                    }, 500);
                    return;
                }

                // 尝试读取响应体
                let bodyText = '';
                try {
                    const clone = resp.clone();
                    bodyText = await clone.text();
                    if (bodyText.length > 200) bodyText = bodyText.substring(0, 200) + '…';
                } catch (_) {}

                if (resp.status === 401) {
                    showError('❌ 用户名或密码错误，请重试');
                    showDebug(`❌ 401 Unauthorized<br>${bodyText || '（无响应体）'}`);
                } else if (resp.status === 403) {
                    showError('❌ 禁止访问，请检查网络或代理');
                    showDebug(`❌ 403 Forbidden<br>${bodyText || '（无响应体）'}`);
                } else if (resp.status === 404) {
                    showError('❌ 认证接口不存在，请检查部署');
                    showDebug(`❌ 404 Not Found<br>URL: /__auth_check 不存在<br>可能 Caddy 配置未生效`);
                } else if (resp.status === 500 || resp.status === 502 || resp.status === 503) {
                    showError(`❌ 服务器错误 (${resp.status})，请稍后重试`);
                    showDebug(`❌ ${resp.status} ${resp.statusText}<br>${bodyText || '（无响应体）'}`);
                } else {
                    showError(`❌ 未知错误 (${resp.status})，请查看诊断信息`);
                    showDebug(`❌ ${resp.status} ${resp.statusText}<br>${bodyText || '（无响应体）'}`);
                }
            } catch (err) {
                const msg = err.message || String(err);
                showError('❌ 网络错误，请检查连接');
                showDebug(`❌ 网络异常<br>错误类型: ${err.name || 'Unknown'}<br>错误信息: ${msg}<br><br>可能原因：<br>• 服务器未响应（Caddy 未启动）<br>• 网络不通（检查 WiFi/流量）<br>• 跨域被拦截（Mixed Content）<br>• 证书问题（HTTPS 访问 HTTP 后端）`);
            } finally {
                btn.disabled = false;
                btnLabel.style.display = 'inline';
                btnSpinner.classList.remove('show');
            }
        });
    </script>
</body>
</html>
